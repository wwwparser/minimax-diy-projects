# Исправления исходных инструкций по результатам инженерной проверки (diy-project-engineer).
# size/summary/steps/steps4 заменяют текст проекта на сайте; fixes — что было не так и что исправлено.
1:
  size: "145×270×600 мм с планкой, дно 105×145, леток 50 мм"
  summary: "Скворечник с односкатной крышей: козырёк над летком, крыша откидывается назад на двух петлях — чистить гнездо удобно. Сзади планка для крепления к дереву, под летком жёрдочка. Одна доска 20×145 и брусок 40×40. Второй вариант — как в статье, с плоской съёмной крышей — ниже."
  steps:
    - "Разметка и раскрой. Из доски 20×145×2000 в стусле напилить: переднюю стенку 260 мм, заднюю 304 мм, две боковины по 305 мм, крышу 240 мм и дно 145 мм. Из бруска 40×40 отпилить планку 600 мм."
    - "Скос боковин. На каждой боковине отметить высоту 265 мм у передней кромки и 305 мм у задней, соединить линией и отпилить ножовкой по линии — получится уклон крыши около 15°. Дно распустить вдоль до ширины 105 мм."
    - "Шлифовка. Снять заусенцы шкуркой P120 со всех кромок. Внутреннюю сторону передней стенки не шлифовать, а сделать ножом или ножовкой поперечные насечки — по ним птенцы выбираются наружу."
    - "Леток. На передней стенке провести вертикальную ось посередине (72,5 мм от края). Центр летка — на оси, в 85 мм от верхнего торца. Коронкой ⌀50 сверлить на первой скорости с двух сторон до середины — так не будет сколов."
    - "Жёрдочка. На 15 мм ниже нижнего края летка (центр в 135 мм от низа стенки) перьевым сверлом 12 мм сделать гнездо глубиной 15 мм с наружной стороны. Вклеить шкант 12×50 на ПВА, наружу выступает 35 мм."
    - "Разметка крепежа. На передней и задней стенках провести линии в 10 мм от боковых кромок — это середина толщины боковин. На каждой линии наметить 3 отверстия: в 25 мм от низа, посередине и в 25 мм от верха боковины. Засверлить насквозь сверлом 3 мм с зенкером — головки саморезов утопятся."
    - "Планка. К задней стенке по центру изнутри, пока короб не собран, прикрутить брусок 40×40×600 тремя саморезами 3,5×41: планка выступает на 150 мм ниже дна и на 146 мм выше стенки."
    - "Боковины и дно. Поставить дно между боковинами заподлицо по низу и прикрутить через каждую боковину двумя саморезами 3,5×41 в кромку дна, в 25 мм от краёв."
    - "Передняя стенка. Приставить к боковинам, выровнять по низу и бокам, прикрутить по три самореза 3,5×41 с каждой стороны."
    - "Задняя стенка. Так же прикрутить заднюю стенку с планкой — по три самореза с каждой стороны; саморезы идут в стороне от планки."
    - "Крыша. Положить крышу на скосы боковин козырьком вперёд: свес 40 мм над летком, задний край — у задней стенки. Сзади поставить две карточные петли 25 мм в 30 мм от краёв, по два шурупа 3,5×16 в каждую створку. Крыша откидывается назад для чистки."
    - "Проверка. Крыша ложится плотно, петли не заедают, острия саморезов нигде не выходят наружу."
    - "Установка. Прикрутить или примотать планку проволокой к дереву или столбу на высоте 3–5 м, летком на восток или юг, с небольшим наклоном вперёд. Раз в год, осенью, откинуть крышу и вычистить гнездо."
  steps4: ["Напилить детали, скосить боковины", "Леток коронкой, жёрдочка", "Собрать короб на саморезы", "Крыша на 2 петли, планка"]
  variant_steps:
    01_skvorechnik_b_ploskaya_krysha:
      - "Раскрой. Из доски 20×145×2000 напилить: переднюю, заднюю стенки и две боковины по 280 мм, крышу 220 мм, дно 145 мм (распустить до 105). Из бруска 40×40 — планку 600 мм."
      - "Шлифовка кромок P120; внутреннюю сторону передней стенки не шлифовать — сделать насечки для птенцов."
      - "Леток ⌀45, как в статье: центр на оси передней стенки в 100 мм от верха (треть высоты). Коронкой с двух сторон до середины."
      - "Жёрдочка: гнездо ⌀12 глубиной 15 мм на 15 мм ниже летка (центр в 142,5 мм от низа), шкант 12×50 на ПВА."
      - "Отверстия под саморезы — в 10 мм от кромок передней и задней стенок (в статье 9 мм — половина толщины доски), по 3 на сторону, сверлом 3 мм с зенкером."
      - "Планку 40×40×600 изнутри прикрутить к задней стенке тремя саморезами 3,5×41 до сборки короба."
      - "Дно между боковинами — по два самореза 3,5×41 через каждую боковину. Затем передняя и задняя стенки — по три самореза с каждой стороны, выравнивая по низу."
      - "Крыша, как в статье: выровнять по задней стенке, спереди свес 35 мм. Просверлить в крыше 4 отверстия с зенковкой: 2 в 10 мм от заднего края и 2 в 45 мм от переднего — над серединой передней стенки. Прикрутить саморезами 3,5×51: в торец стенки нужен заход длиннее, чем 41."
      - "Для чистки раз в год выкрутить 4 самореза и снять крышу."
      - "Повесить на 3–5 м, летком на восток или юг, с небольшим наклоном вперёд."
  fixes:
    - "Исходная инструкция описывала другую конструкцию, чем в статье-источнике и на плакате: плоскую крышу без уклона, без жёрдочки и планки. Проект переделан в два варианта: с наклонной крышей на петлях (как на плакате) и с плоской съёмной крышей (как «Эконом» в статье)."
    - "Саморезы 32 мм входили во вторую доску всего на 12 мм при минимуме 14 — теперь 3,5×41 (заход 21 мм), а в торцы стенок под плоской крышей — 3,5×51."
    - "Дно 150×150 из доски 145 мм не получить: между боковинами остаётся 105 мм — дно 105×145."
    - "Одна петля 25 мм давала перекос откидной крыши — поставлены две."

