# Лепестковая шлифовальная насадка: болт М6х60 как вал, на него нанизаны шайбы/гайки и веер полос наждачки.
# Это НЕ столярное изделие — крепёж без досок. Единственная геометрическая деталь — вал (болт).
# Гайки/шайбы и полосы шкурки не образуют "соединений" в столярном смысле (joint) — это надетые на вал
# покупные детали и расходник, поэтому смоделированы как hardware/ambiguities, а не как parts+joints.
project:
  id: 46_lepestkovaya_shlifoval_naya_nasadka_na_s
  name: "Лепестковая шлифовальная насадка на шуруповёрт"
  category: metalworking
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Нарезать шкурку P80 на полосы 50х30 мм. Надеть на болт М6х60 гайку и широкую шайбу. Набрать полосы
    шкурки «веером», с другой стороны шайба и гайка — затянуть. Зажать хвостовик болта в патрон.

stock:
  - {id: rod6, name: "Болт М6х60 (вал насадки)", material: galvanized, type: threaded_rod, diameter: 6, length: 60, kerf: 0}

parts:
  - id: bolt_shaft
    name: "Болт М6х60 (вал)"
    stock: rod6
    length: 60
    orient: XYZ
    at: [0, 0, 0]

hardware:
  - {id: nuts, type: other, name: "Гайка М6 DIN 934", qty: 2, mounts: [bolt_shaft]}
  - {id: washers, type: other, name: "Шайба кузовная 6х18 мм", qty: 2, mounts: [bolt_shaft]}

steps:
  - {title: "Надеть гайку и широкую шайбу на болт", add: [bolt_shaft], joints: []}
  - {title: "Набрать веер полос шкурки, закрыть шайбой и гайкой, затянуть", add: [], joints: []}

ambiguities:
  - "Проект целиком выходит за рамки типичной столярной модели: единственная геометрическая деталь — вал
     (болт М6х60), гайки/шайбы — покупные hardware (не joint, надеваются на вал), полосы наждачной бумаги
     P80 50х30 мм — расходник без несущей геометрии, не формализован как part."
  - "Диаметр насадки ~80 мм из шапки текста определяется длиной лепестков шкурки (веером), а не размером
     вала — геометрически не сверяется с моделью вала (жёсткого противоречия с валом М6х60 нет, claim не заводился)."
  - "Число гаек/шайб (по 2 каждой, с двух сторон веера) и их точные sku по каталогу Петровича не подобраны
     автоматически (нет типа hardware=nut/washer в каталоге под тип 'other') — ожидаема находка bom.not_in_catalog/bom.unpriced."

constraints: {budget: 3000}
