# Ящик для инструментов с ручкой: короб из доски 20х145 (дно, 2 борта, 2 торца с "домиком"),
# между торцами - ручка из бруска 20х45. Клей + саморезы 32мм, лак.
# Оси: X - длина короба (0..500), Y - глубина (0..145), Z - высота (дно 0..20, борт/торец от 20 вверх).
project:
  id: yaschik_dlya_instrumentov_s_ruchkoy_027
  name: "Ящик для инструментов с ручкой"
  category: woodworking
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Нарезать доску 20х145: дно 500, 2 борта 500, 2 торца 250 мм (верх торцов — «домиком» в стусле).
    Собрать короб на клей и саморезы 32 мм. Между торцами прикрутить ручку из бруска 20х45 длиной 540 мм.
    Скруглить ручку шкуркой. Покрыть лаком.

stock:
  - id: board20145
    name: "Доска сухая строганая 20х145х2000"
    material: pine
    type: board
    section: 20x145
    length: 2000
    qty: 2
    kerf: 1.5
    sku: "102355"
  - id: bar2045
    name: "Брусок сухой строганый 20х45х2000 (ручка)"
    material: pine
    type: bar
    section: 20x45
    length: 2000
    sku: "626000"

parts:
  - id: bottom
    name: Дно
    stock: board20145
    length: 500
    orient: XYZ
    at: [0, 0, 0]
  - id: side
    name: Борт
    stock: board20145
    qty: 2
    length: 500
    instances:
      - {at: [0, 0, 20], orient: XZY}
      - {at: [0, 125, 20], orient: XZY}
  - id: end
    name: "Торец (домиком)"
    stock: board20145
    qty: 2
    length: 250
    width: 105
    shape: {type: polygon, points: [[0, 0], [0, 105], [190, 105], [250, 52.5], [190, 0]]}
    instances:
      - {at: [0, 20, 20], orient: ZYX}
      - {at: [480, 20, 20], orient: ZYX}
  - id: handle
    name: Ручка
    stock: bar2045
    length: 540
    width: 45
    orient: XYZ
    at: [-20, 50, 270]

joints:
  - {id: side1_end1, type: screw, part_a: "side#1", part_b: "end#1", fastener: {type: wood_screw, diameter: 3.5, length: 32}, glue: true}
  - {id: side1_end2, type: screw, part_a: "side#1", part_b: "end#2", fastener: {type: wood_screw, diameter: 3.5, length: 32}, glue: true}
  - {id: side2_end1, type: screw, part_a: "side#2", part_b: "end#1", fastener: {type: wood_screw, diameter: 3.5, length: 32}, glue: true}
  - {id: side2_end2, type: screw, part_a: "side#2", part_b: "end#2", fastener: {type: wood_screw, diameter: 3.5, length: 32}, glue: true}
  - {id: bottom_side1, type: screw, part_a: bottom, part_b: "side#1", fastener: {type: wood_screw, diameter: 3.5, length: 32}, glue: true}
  - {id: bottom_end1, type: screw, part_a: bottom, part_b: "end#1", fastener: {type: wood_screw, diameter: 3.5, length: 32}, glue: true}
  - {id: handle_end1, type: screw, part_a: handle, part_b: "end#1", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: handle_end2, type: screw, part_a: handle, part_b: "end#2", fastener: {type: wood_screw, diameter: 3.5}}

finishes:
  - {id: f1, type: varnish_aerosol, parts: all, coats: 1, sku: "1098186"}

steps:
  - {title: "Собрать короб: борта и торцы на клей и саморезы", add: [side, end], joints: [side1_end1, side1_end2, side2_end1, side2_end2]}
  - {title: "Прикрутить дно", add: [bottom], joints: [bottom_side1, bottom_end1]}
  - {title: "Прикрутить ручку между торцами поверху", add: [handle], joints: [handle_end1, handle_end2]}
  - {title: "Скруглить ручку шкуркой, покрыть лаком", add: [], joints: []}

claims:
  - {kind: overall, value: [500, 200, 250], source: "шапка текста", tolerance: 5}

ambiguities:
  - "Шапка текста заявляет габарит 500×200×250. Глубина короба по модели 145 мм (ширина доски 20×145), а не 200 — конфликт оставлен в claims. Высота торцов (домиком) 250 мм совпадает с моделью, но общая высота изделия с ручкой поверху больше (дно 20 + торец 250 + ручка 45 = 315 мм)."
  - "Торцы «домиком» смоделированы как пятиугольник (прямоугольная нижняя часть + треугольный скат) с шириной 105 мм (роспуск из доски 145 мм) — ширина ската текстом не задана числом, скат принят симметричным с пиком по центру."
  - "Ручка длиной 540 мм длиннее короба (500 мм) на 40 мм — выступает по 20 мм за каждый торец; текст это не поясняет явно, принято как выступающие концы ручки."
  - "Засверловка/направление саморезов между ручкой и пиком торца — упрощено: ручка крепится к верхней (пиковой) кромке торца."

constraints: {budget: 3000}
