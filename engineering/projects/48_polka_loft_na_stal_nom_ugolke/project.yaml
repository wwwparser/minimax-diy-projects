# Полка лофт: доска 20×145×800 на двух отрезках уголка 25×25×3 длиной 250 мм.
# Стена — плоскость y = 0. Вертикальная полка уголка лежит на стене (дюбели), горизонтальная — снизу,
# на ней доска; доска упирается задней кромкой в вертикальную полку. Саморезы — снизу через полку уголка в доску.
project:
  id: 48_polka_loft_na_stal_nom_ugolke
  name: "Полка лофт на стальном уголке"
  category: wood+metal
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Отпилить от уголка 25×25×3 два куска по 250 мм, заусенцы снять шкуркой. В вертикальной полке каждого
    просверлить 2 отверстия 6 мм под дюбели. Покрасить уголки грунт-эмалью и прикрутить к стене на дюбели.
    Положить доску, просверлить насквозь доску и горизонтальную полку уголка (по 2 отверстия 6,6 мм) и стянуть
    мебельными болтами М6 с гайками: саморез в доску 20 мм через уголок держит слабо. Доску покрыть морилкой.

stock:
  - {id: board145, name: "Доска 20×145", material: pine, type: board, section: 20x145, length: 2000, kerf: 1.5, sku: "102355"}
  - {id: angle25, name: "Уголок 25×25×3", material: steel, type: angle, section: 25x25x3, length: 3000, kerf: 1.2, sku: "612294"}

parts:
  - id: bracket
    name: Кронштейн из уголка
    stock: angle25
    qty: 2
    length: 250
    instances:
      - {at: [50, 0, 225], orient: XYZ}      # 250 вдоль стены; полка по Y (25) снизу, полка по Z (25) у стены
      - {at: [500, 0, 225], orient: XYZ}
  - id: shelf
    name: Полка
    stock: board145
    length: 800
    orient: XYZ
    at: [0, 3, 228]

joints:
  - {id: shelf_br1, type: bolt, part_a: shelf, part_b: "bracket#1", fastener: {type: bolt, diameter: 6}, count: 2}
  - {id: shelf_br2, type: bolt, part_a: shelf, part_b: "bracket#2", fastener: {type: bolt, diameter: 6}, count: 2}

hardware:
  - {id: wall_dowels, type: wall_dowel, qty: 4, mounts: ["bracket#1", "bracket#2"], screws_per_unit: 0, name: "Дюбель 6×30 с шурупом", sku: "687547"}

finishes:
  - {id: stain, type: stain, parts: [shelf], coats: 1}
  - {id: paint, type: enamel_aerosol, parts: [bracket], coats: 2, sku: "1098184"}

steps:
  - {title: "Уголки к стене на дюбели", add: [bracket], joints: []}
  - {title: "Доска на уголки, мебельные болты М6 насквозь", add: [shelf], joints: [shelf_br1, shelf_br2]}

claims:
  - {kind: overall, value: [800, 148, 25], source: "полка 800×145 на уголке 25 мм", tolerance: 5}

ambiguities:
  - "Полка лёгкая: горизонтальная полка уголка поддерживает доску на 22 мм от стены — для книг и цветов, не для тяжёлого."

constraints: {budget: 3000}
