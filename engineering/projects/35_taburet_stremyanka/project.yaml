# Табурет-стремянка 400×435×450: две ступени лесенкой.
# Каждая боковина — три доски 20×145 на клею: передняя короче (225 мм) — нижняя ступень,
# средняя и задняя во всю высоту (450) — верхняя ступень-сиденье. Ступени лежат на опорных
# брусках 40×40, прикрученных к боковинам изнутри. Сзади внизу — распорка из бруска.
# X — ширина (боковины x 0..20 и 380..400), Y — глубина (перед y=0), Z — вверх.
project:
  id: 35_taburet_stremyanka
  name: "Табурет-стремянка"
  category: woodworking
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Боковины: из доски 20×145 склеить по три доски (передняя 225 мм, средняя и задняя 450 мм) — получится
    лесенка. Нижняя ступень — одна доска 360 мм на высоте 225, верхняя — две доски 360 мм на высоте 450.
    Под ступени изнутри боковин прикрутить опорные бруски 40×40. Сзади внизу — распорка из бруска 40×40.
    Собрать на клей и конструкционные саморезы, лак в 2 слоя.

stock:
  - {id: board145, name: "Доска 20×145", material: pine, type: board, section: 20x145, length: 2000, kerf: 1.5, sku: "102355"}
  - {id: bar4040, name: "Брусок 40×40", material: pine, type: bar, section: 40x40, length: 2000, kerf: 1.5, sku: "1092607"}

parts:
  - id: side_front
    name: Боковина, передняя доска (225)
    stock: board145
    qty: 2
    length: 225
    instances:
      - {at: [0, 0, 0], orient: ZYX}
      - {at: [380, 0, 0], orient: ZYX}
  - id: side_mid
    name: Боковина, средняя доска (450)
    stock: board145
    qty: 2
    length: 450
    instances:
      - {at: [0, 145, 0], orient: ZYX}
      - {at: [380, 145, 0], orient: ZYX}
  - id: side_back
    name: Боковина, задняя доска (450)
    stock: board145
    qty: 2
    length: 450
    instances:
      - {at: [0, 290, 0], orient: ZYX}
      - {at: [380, 290, 0], orient: ZYX}
  - id: cleat_lo
    name: Опорный брусок нижней ступени
    stock: bar4040
    qty: 2
    length: 145
    instances:
      - {at: [20, 0, 165], orient: YXZ}
      - {at: [340, 0, 165], orient: YXZ}
  - id: cleat_hi
    name: Опорный брусок верхней ступени
    stock: bar4040
    qty: 2
    length: 290
    instances:
      - {at: [20, 145, 390], orient: YXZ}
      - {at: [340, 145, 390], orient: YXZ}
  - id: tread_lo
    name: Нижняя ступень
    stock: board145
    length: 360
    orient: XYZ
    at: [20, 0, 205]
  - id: tread_hi
    name: Верхняя ступень-сиденье
    stock: board145
    qty: 2
    length: 360
    instances:
      - {at: [20, 145, 430], orient: XYZ}
      - {at: [20, 290, 430], orient: XYZ}
  - id: brace
    name: Задняя распорка
    stock: bar4040
    length: 360
    orient: XYZ
    at: [20, 395, 0]

joints:
  # боковины склеены из досок
  - {id: glue_l_fm, type: glue, part_a: "side_front#1", part_b: "side_mid#1"}
  - {id: glue_l_mb, type: glue, part_a: "side_mid#1", part_b: "side_back#1"}
  - {id: glue_r_fm, type: glue, part_a: "side_front#2", part_b: "side_mid#2"}
  - {id: glue_r_mb, type: glue, part_a: "side_mid#2", part_b: "side_back#2"}
  # опорные бруски — через боковину в брусок
  - {id: cl_lo_l, type: screw, part_a: "side_front#1", part_b: "cleat_lo#1", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: cl_lo_r, type: screw, part_a: "side_front#2", part_b: "cleat_lo#2", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: cl_hi_lm, type: screw, part_a: "side_mid#1", part_b: "cleat_hi#1", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: cl_hi_lb, type: screw, part_a: "side_back#1", part_b: "cleat_hi#1", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: cl_hi_rm, type: screw, part_a: "side_mid#2", part_b: "cleat_hi#2", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: cl_hi_rb, type: screw, part_a: "side_back#2", part_b: "cleat_hi#2", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  # ступени — сверху в опорные бруски
  - {id: tr_lo_l, type: screw, part_a: tread_lo, part_b: "cleat_lo#1", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: tr_lo_r, type: screw, part_a: tread_lo, part_b: "cleat_lo#2", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: tr_hi1_l, type: screw, part_a: "tread_hi#1", part_b: "cleat_hi#1", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: tr_hi1_r, type: screw, part_a: "tread_hi#1", part_b: "cleat_hi#2", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: tr_hi2_l, type: screw, part_a: "tread_hi#2", part_b: "cleat_hi#1", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: tr_hi2_r, type: screw, part_a: "tread_hi#2", part_b: "cleat_hi#2", fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  # распорка — через заднюю доску боковины в торец бруска
  - {id: brace_l, type: screw, part_a: "side_back#1", part_b: brace, fastener: {type: wood_screw, diameter: 4.0}, glue: true}
  - {id: brace_r, type: screw, part_a: "side_back#2", part_b: brace, fastener: {type: wood_screw, diameter: 4.0}, glue: true}

finishes:
  - {id: f1, type: varnish, parts: all, coats: 2}

steps:
  - {title: "Склеить боковины из трёх досок", add: [side_front, side_mid, side_back], joints: [glue_l_fm, glue_l_mb, glue_r_fm, glue_r_mb]}
  - {title: "Опорные бруски изнутри боковин", add: [cleat_lo, cleat_hi], joints: [cl_lo_l, cl_lo_r, cl_hi_lm, cl_hi_lb, cl_hi_rm, cl_hi_rb]}
  - {title: "Задняя распорка", add: [brace], joints: [brace_l, brace_r]}
  - {title: "Ступени на клей и саморезы", add: [tread_lo, tread_hi], joints: [tr_lo_l, tr_lo_r, tr_hi1_l, tr_hi1_r, tr_hi2_l, tr_hi2_r]}

claims:
  - {kind: overall, value: [400, 435, 450], source: "исправленная шапка: 400×435×450 мм", tolerance: 5}
  - {kind: part_dim, target: tread_lo, value: [360, 145], source: "исправленные шаги: ступень 360 мм"}

ambiguities:
  - "Антискользящие полосы на ступенях — расходник, в модели не показаны."
  - "Нагрузка на стремянку не рассчитывалась: конструкция на клею и конструкционных саморезах, для взрослого — проверить на устойчивость."

constraints: {budget: 3000}
