    text: "Положить крышу на скосы боковин козырьком вперёд: свес 40 мм над летком, задний край — у задней стенки. Сзади поставить две карточные петли 25 мм в 30 мм от краёв, по два шурупа 3,5×16 в каждую створку. Крыша откидывается назад для чистки."
