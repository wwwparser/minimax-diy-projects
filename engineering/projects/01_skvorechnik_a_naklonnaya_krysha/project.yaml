    view: {azim: -15, elev: 42}

  - title: "Разметка крепежа"
    text: "На передней и задней стенках провести линии в 10 мм от боковых кромок — это середина толщины боковин. На каждой линии наметить 3 отверстия: в 25 мм от низа, посередине и в 25 мм от верха боковины. Засверлить насквозь сверлом 3 мм с зенкером — головки саморезов утопятся."
