# Скамья Олдо Леопольда. Оригинал — крест-накрест поставленные диагональные ноги, стянутые мебельным болтом
# в точке пересечения. Движок работает только с деталями, оси которых совпадают с осями сборки (X/Y/Z),
# поэтому диагональная постановка ног не воспроизводима буквально. Упрощение (см. notes.md/ambiguities):
# короткая и длинная ноги поставлены ВЕРТИКАЛЬНО борт о борт (соприкасаются гранью), стянуты мебельным
# болтом через место соприкосновения — сохранена логика «короткая нога держит сиденье, длинная идёт
# выше и держит спинку», но без реального угла наклона и настоящего скрещивания.
project:
  id: 25_skam_ya_oldo_leopol_da
  name: "Скамья Олдо Леопольда"
  category: woodworking
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Из доски 45×95 нарезать: 2 длинные ноги 900, 2 короткие 550, сиденье 1100 и спинку 1100 мм.
    Сложить длинную и короткую ноги крест-накрест под углом, просверлить сквозь 8 мм, стянуть мебельными
    болтами. Сиденье прикрутить к коротким ногам конструкционными саморезами. Спинку — к верхним концам
    длинных ног. Пропитать антисептиком.

stock:
  - {id: board4595, name: "Доска 45×95", material: pine, type: board, section: 45x95, length: 3000, kerf: 1.5, sku: '1224118'}

parts:
  - id: short_leg
    name: Короткая нога
    stock: board4595
    qty: 2
    length: 550
    instances:
      - {at: [0, 0, 0], orient: ZXY}
      - {at: [1005, 0, 0], orient: ZXY}
  - id: long_leg
    name: Длинная нога
    stock: board4595
    qty: 2
    length: 900
    instances:
      - {at: [0, 45, 0], orient: ZXY}
      - {at: [1005, 45, 0], orient: ZXY}
  # Сиденье лежит только на коротких ногах (ширина уменьшена до 45 мм — см. ambiguities: при полной ширине
  # 95 мм сиденье пересеклось бы с длинными ногами, которые в этой упрощённой вертикальной модели
  # продолжаются выше сиденья).
  - id: seat
    name: Сиденье
    stock: board4595
    length: 1100
    width: 45
    orient: XYZ
    at: [0, 0, 550]
  - id: back
    name: Спинка
    stock: board4595
    length: 1100
    orient: XYZ
    at: [0, 45, 900]

joints:
  - {id: cross1, type: bolt, part_a: long_leg#1, part_b: short_leg#1, fastener: {type: bolt, diameter: 8}}
  - {id: cross2, type: bolt, part_a: long_leg#2, part_b: short_leg#2, fastener: {type: bolt, diameter: 8}}
  - {id: seat_leg1, type: screw, part_a: seat, part_b: short_leg#1, fastener: {type: wood_screw, diameter: 4.0}}
  - {id: seat_leg2, type: screw, part_a: seat, part_b: short_leg#2, fastener: {type: wood_screw, diameter: 4.0}}
  - {id: back_leg1, type: screw, part_a: back, part_b: long_leg#1, fastener: {type: wood_screw, diameter: 4.0}}
  - {id: back_leg2, type: screw, part_a: back, part_b: long_leg#2, fastener: {type: wood_screw, diameter: 4.0}}

finishes:
  - {id: f1, type: antiseptic, parts: all, coats: 1, sku: '1098347'}

steps:
  - {title: "Скрестить и стянуть ноги", add: [short_leg, long_leg], joints: [cross1, cross2]}
  - {title: "Сиденье на короткие ноги", add: [seat], joints: [seat_leg1, seat_leg2]}
  - {title: "Спинка на верх длинных ног", add: [back], joints: [back_leg1, back_leg2]}

claims:
  - {kind: overall, value: [1100, 380, 430], source: "шапка текста", tolerance: 10}
  - {kind: part_dim, target: seat, value: [1100, 95], source: "шаги текста (доска 45×95)"}

ambiguities:
  - "Оригинальная конструкция — диагонально скрещённые ноги (классическая скамья Олдо Леопольда); движок поддерживает только осевые (X/Y/Z) ориентации деталей, поэтому диагональ не моделируется буквально. Упрощение: короткая и длинная ноги поставлены вертикально борт о борт и стянуты болтом в месте соприкосновения — логика «короткая нога держит сиденье, длинная выше держит спинку» сохранена, реальный угол наклона и высота (430 мм из шапки) — нет: по модели длинная нога вертикальна на всю длину 900 мм, итоговая высота модели около 900 мм."
  - "Ширина сиденья в модели уменьшена с 95 до 45 мм, чтобы избежать коллизии с длинными ногами (в реальной диагональной конструкции сиденье лежит в раскрытии между ногами и коллизии нет) — заложено в claims (part_dim)."
  - "Длина мебельных болтов не указана в тексте (только диаметр 8 мм) — длину не задавал, движок подобрал сам; в смете указан болт 8×80 мм — это лишь конкретная позиция из сметы, не требование текста."

constraints: {budget: 3000}
