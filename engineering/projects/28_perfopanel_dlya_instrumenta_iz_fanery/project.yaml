# Перфопанель 750×750: фанера 6 мм с сеткой отверстий 6 мм на рамке из бруска 20×30,
# брусок поставлен «на ребро» 30 мм к стене — отступ для крючков и достаточная глубина для самореза.
# Стена — плоскость y = 0 (сзади), лицевая сторона панели — y = 36.
project:
  id: 28_perfopanel_dlya_instrumenta_iz_fanery
  name: "Перфопанель для инструмента из фанеры"
  category: woodworking
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Отпилить квадрат 750×750 из листа фанеры 6 мм. Разметить сетку 50×50 мм, просверлить отверстия 6 мм
    (подложить обрезок доски снизу). Сзади прикрутить рамку из бруска 20×30, поставленного на ребро: отступ
    от стены 30 мм. Панель к рамке — саморезами 3,5×32. Повесить на дюбели с шурупами.

stock:
  - {id: ply6, name: "Фанера ФК 6 мм", material: birch_plywood, type: sheet, thickness: 6, length: 1525, width: 1525, grain: any, kerf: 1.5, sku: "109060"}
  - {id: bar2030, name: "Брусок 20×30", material: pine, type: bar, section: 20x30, length: 2000, kerf: 1.5, sku: "626001"}

parts:
  - id: rail_h
    name: Рамка (верх/низ)
    stock: bar2030
    qty: 2
    length: 750
    instances:
      - {at: [0, 0, 0], orient: XYZ}         # 750 по X, 30 по Y (к стене), 20 по Z
      - {at: [0, 0, 730], orient: XYZ}
  - id: rail_v
    name: Рамка (бок)
    stock: bar2030
    qty: 2
    length: 710
    instances:
      - {at: [0, 0, 20], orient: ZYX}        # 710 по Z, 30 по Y, 20 по X
      - {at: [730, 0, 20], orient: ZYX}
  - id: panel
    name: Панель с перфорацией
    stock: ply6
    length: 750
    width: 750
    orient: ZXY                              # 750 по Z, 750 по X, 6 по Y
    at: [0, 30, 0]
    features:
      - {type: hole_grid, diameter: 6, pitch: [50, 50], margin: [75, 75]}

joints:
  - {id: panel_rail_bottom, type: screw, part_a: panel, part_b: "rail_h#1", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: panel_rail_top,    type: screw, part_a: panel, part_b: "rail_h#2", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: panel_rail_left,   type: screw, part_a: panel, part_b: "rail_v#1", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: panel_rail_right,  type: screw, part_a: panel, part_b: "rail_v#2", fastener: {type: wood_screw, diameter: 3.5}}

hardware:
  - {id: wall_dowels, type: wall_dowel, qty: 4, mounts: ["rail_h#1", "rail_h#2"], screws_per_unit: 0, name: "Дюбель 6×30 с шурупом", sku: "687547"}

steps:
  - {title: "Рамка из бруска на ребро", add: [rail_h, rail_v], joints: []}
  - {title: "Панель с отверстиями на рамку", add: [panel], joints: [panel_rail_bottom, panel_rail_top, panel_rail_left, panel_rail_right]}

claims:
  - {kind: overall, value: [750, 36, 750], source: "исправленная шапка: 750×750, отступ от стены 30 мм", tolerance: 5}

consumables:
  - {type: sandpaper, grits: [120]}

ambiguities:
  - "Сетка отверстий начинается в 75 мм от края, чтобы не попадать в бруски рамки (рамка 20 мм + запас)."
  - "Колышки и полочки на шкантах 6×30 вставляются в отверстия — отдельными деталями не моделировались."

constraints: {budget: 3000}
