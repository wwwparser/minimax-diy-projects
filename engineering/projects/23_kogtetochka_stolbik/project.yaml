# Когтеточка-столбик: брусок 50х50х600 вертикально, прикручен к центру фанеры 12х505х505 снизу
# двумя саморезами 90 мм, обмотан джутовым канатом (декоративно, без жёсткой геометрии).
# Оси: X,Y - основание 505х505 (центр столбика в 227.5;227.5), Z - высота.
project:
  id: kogtetochka_stolbik_023
  name: "Когтеточка-столбик"
  category: woodworking
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Отпилить брусок 50х50 на 600 мм. Прикрутить его к центру фанеры 12 мм снизу двумя саморезами 90 мм.
    Обмотать столбик джутовым канатом виток к витку, фиксируя монтажным клеем каждые 10 см.
    Основание по желанию обтянуть ковролином.

stock:
  - id: bar50
    name: "Брусок сухой строганый 50х50х2000 профилированный"
    material: pine
    type: bar
    section: 50x50
    length: 2000
    kerf: 1.5
    sku: "1092606"
  - id: ply12
    name: "Фанера ФК 12х505х505"
    material: birch_plywood
    type: sheet
    thickness: 12
    length: 505
    width: 505
    grain: any
    kerf: 1.5
    sku: "634466"
  - id: jute6
    name: "Канат крученый джутовый d6"
    material: jute
    type: rope
    diameter: 6
    length: 15000
    sku: "128606"

parts:
  - id: base
    name: Основание
    stock: ply12
    length: 505
    width: 505
    orient: XYZ
    at: [0, 0, 0]
  - id: post
    name: Столбик
    stock: bar50
    length: 600
    orient: ZXY
    at: [227.5, 227.5, 12]   # центр основания 505/2 - 50/2 = 227.5; стоит на верхней грани фанеры (z=12)
  - id: wrap
    name: "Джутовый канат (обмотка столбика)"
    stock: jute6
    length: 15000

joints:
  - {id: post_base, type: screw, part_a: base, part_b: post, fastener: {type: wood_screw, diameter: 4.2, length: 90}, count: 2}
  - {id: wrap_post, type: hang, part_a: wrap, part_b: post}

finishes: []

steps:
  - {title: "Основание и столбик", add: [base, post], joints: [post_base]}
  - {title: "Обмотка джутовым канатом на клей", add: [wrap], joints: [wrap_post]}

claims:
  - {kind: overall, value: [505, 505, 600], source: "шапка текста", tolerance: 5}

ambiguities:
  - "Высота из шапки текста 600 мм совпадает с длиной столбика, но полная высота сборки (столбик 600 + фанера 12 снизу) = 612 мм — 12 мм разницы, в шапке скорее всего имелась в виду длина заготовки столбика; конфликт зафиксирован в claims (overall), не подгонял."
  - "Джутовый канат-обмотка (15 пог. м, d6) — декоративная деталь без жёсткой геометрии (part без 'at'), joint type hang к столбику, движок не проверяет реальную плотность витков и промазку монтажным клеем каждые 10 см."
  - "Монтажный клей для фиксации витков каната (арт.794456 из сметы) не смоделирован как hardware/finish — в каталоге Петровича этого артикула нет (bom.not_in_catalog ожидаем, если добавить), клей не входит ни в одну из категорий фурнитуры/отделки движка."
  - "Обтяжка основания ковролином — опциональная отделка «по желанию», текстом не детализирована и не моделируется."

constraints: {budget: 3000}
