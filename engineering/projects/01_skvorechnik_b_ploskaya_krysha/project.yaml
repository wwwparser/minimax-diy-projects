# Скворечник, вариант Б — как в статье usadbamasterov.ru («Эконом» 30×14): прямоугольный короб, плоская
# съёмная крыша с козырьком над летком, выровнена по задней стенке и прикручена 4 саморезами (выкрутил — снял
# для чистки), жёрдочка под летком, сзади планка для крепления к дереву.
# X — ширина (145), Y — глубина (перед y=0), Z — вверх.
project:
  id: 01_skvorechnik_b_ploskaya_krysha
  name: "Скворечник с плоской съёмной крышей"
  category: woodworking
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    По статье: леток ⌀45 мм, центр в 1/3 высоты — 100 мм от верха передней стенки; шесток ⌀12 длиной 50–70 мм
    на 15 мм ниже летка; отверстия под саморезы в 9 мм от края (половина толщины доски), саморезы 3,5×41;
    на внутренней стороне передней стенки — насечки; дно фиксируется саморезами через стенки; крыша
    выравнивается по задней стенке, с козырьком, крепится саморезами и снимается для чистки.

stock:
  - {id: board145, name: "Доска сосна 20×145", material: pine, type: board, section: 20x145, length: 2000, kerf: 1.5, sku: "102355"}
  - {id: bar40, name: "Брусок 40×40", material: pine, type: bar, section: 40x40, length: 2000, kerf: 1.5, sku: "1092607"}

parts:
  - id: front
    name: Передняя стенка
    stock: board145
    length: 280
    orient: ZXY
    at: [0, 0, 0]
    features:
      - {type: hole_saw, diameter: 45, position: {along_length: 100_from_end, along_width: center}}
      - {type: hole, diameter: 12, depth: 15, face: bottom, position: {along_length: 142.5, along_width: center}}
  - id: back
    name: Задняя стенка
    stock: board145
    length: 280
    orient: ZXY
    at: [0, 165, 0]
  - id: side
    name: Боковина
    stock: board145
    qty: 2
    length: 280
    instances:
      - {at: [0, 20, 0], orient: ZYX}
      - {at: [125, 20, 0], orient: ZYX}
  - id: bottom
    name: Дно
    stock: board145
    length: 145
    width: 105
    orient: YXZ
    at: [20, 20, 0]
  - id: roof
    name: Крыша с козырьком (съёмная)
    stock: board145
    length: 220
    orient: YXZ
    at: [0, -35, 280]
  - id: batten
    name: Планка для крепления к дереву
    stock: bar40
    length: 600
    orient: ZXY
    at: [52.5, 185, -150]
  - id: perch
    name: Жёрдочка (шкант 12×50)
    purchased: true
    profile: rod
    material: birch
    length: 50
    width: 12
    thickness: 12
    orient: YXZ
    at: [66.5, -35, 136.5]

joints:
  - {id: back_batten,  type: screw, part_a: back,     part_b: batten, fastener: {type: wood_screw, diameter: 3.5}, count: 3}
  - {id: bottom_left,  type: screw, part_a: "side#1", part_b: bottom, fastener: {type: wood_screw, diameter: 3.5}}
  - {id: bottom_right, type: screw, part_a: "side#2", part_b: bottom, fastener: {type: wood_screw, diameter: 3.5}}
  - {id: front_left,   type: screw, part_a: front,    part_b: "side#1", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: front_right,  type: screw, part_a: front,    part_b: "side#2", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: back_left,    type: screw, part_a: back,     part_b: "side#1", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: back_right,   type: screw, part_a: back,     part_b: "side#2", fastener: {type: wood_screw, diameter: 3.5}}
  - {id: roof_front,   type: screw, part_a: roof,     part_b: front,    fastener: {type: wood_screw, diameter: 3.5}, count: 2}
  - {id: roof_back,    type: screw, part_a: roof,     part_b: back,     fastener: {type: wood_screw, diameter: 3.5}, count: 2}
  - {id: perch_in,     type: inserted, part_a: perch, part_b: front, glue: true}

hardware:
  - {id: perch_pin, type: dowel_pin, size: "12x50", qty: 1, sku: "640685", screws_per_unit: 0}

steps:
  - {title: "Планка к задней стенке (изнутри, пока короб не собран)", add: [back, batten], joints: [back_batten]}
  - {title: "Боковины и дно", add: [side, bottom], joints: [bottom_left, bottom_right]}
  - {title: "Передняя стенка с летком и жёрдочкой", add: [front, perch], joints: [front_left, front_right, perch_in]}
  - {title: "Задняя стенка к боковинам", add: [], joints: [back_left, back_right]}
  - {title: "Съёмная крыша на 4 самореза", add: [roof], joints: [roof_front, roof_back]}

claims:
  - {kind: overall, value: [145, 260, 600], source: "габарит: высота по планке 600, глубина с козырьком и планкой 260", tolerance: 10}

consumables:
  - {type: sandpaper, grits: [120]}

ambiguities:
  - "В статье короб из мебельного щита 18 мм шириной 300; здесь — из строганой доски 20×145, поэтому дно внутри 105×145."
  - "Чертежи статьи с точными размерами на сайте недоступны (картинки удалены) — высота 280 мм принята по фото «Эконом» 30×14 см."

constraints: {budget: 3000}

