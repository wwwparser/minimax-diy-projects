# 53. Компостер-цилиндр из кладочной сетки: лист сетки 1х2 м сворачивается в цилиндр (d~640, h1000)
# и стягивается 4 болтами М6 с кузовными шайбами внахлёст. Деталь mesh не размещена геометрически
# (правило навыка: свёрнутый лист сетки в цилиндр — деталь можно не размещать) — см. ambiguities.
project:
  id: 53_komposter_cilindr_iz_kladochnoy_setki
  name: "Компостер-цилиндр из кладочной сетки"
  category: metal
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Свернуть сетку в цилиндр с нахлёстом в одну ячейку. Стянуть нахлёст 4 болтами М6 с кузовными
    шайбами. Поставить на землю, закрепить колышками из обрезков. Загружать зелень и землю слоями.

stock:
  - id: mesh_1x2
    name: "Сетка кладочная оцинкованная 55х55 d2,5"
    material: galvanized
    type: mesh
    thickness: 2.5
    length: 2000
    width: 1000
    sku: "1156584"

parts:
  - id: mesh_cyl
    name: "Лист сетки, свёрнутый в цилиндр"
    stock: mesh_1x2
    length: 2000
    width: 1000
    # at/orient не заданы: деталь физически сворачивается в цилиндр и не описывается прямоугольной
    # геометрией сборки (см. ambiguities) — движок оставит её неразмещённой (part.not_placed).

hardware:
  - id: cyl_bolts
    type: other
    qty: 4
    mounts: [mesh_cyl]
    name: "Болт М6х30 DIN 933 с гайкой DIN 934 и кузовной шайбой DIN 9021 — стяжка нахлёста цилиндра"
    sku: "101038"

steps:
  - {title: "Свернуть сетку в цилиндр и стянуть нахлёст болтами М6", add: [mesh_cyl], joints: []}
  - {title: "Поставить на землю, закрепить колышками из обрезков", add: [], joints: []}

ambiguities:
  - "Деталь mesh_cyl не размещена геометрически (нет at/orient): это свёрнутый в цилиндр лист сетки, а не прямоугольная деталь в осях сборки — по правилу навыка для кладочной сетки такую деталь можно не размещать."
  - "Крепёж нахлёста (4 болта М6х30 с гайками DIN 934 и кузовными шайбами DIN 9021) физически соединяет сетку саму с собой внахлёст, а не две разные детали — как joint (part_a/part_b) это не моделируется; заведено как hardware (cyl_bolts) только для фиксации в смете/BOM."
  - "Колышки для крепления к земле (шаг 3) — из обрезков, отдельного артикула в смете нет, в модели не смоделированы (расходник без sku)."
  - "Проверка вручную (диаметр не входит в claims.overall, который сверяет прямоугольный bbox X/Y/Z, а не диаметр цилиндра): при сворачивании листа 1х2 м высота цилиндра = 1000 мм (сторона листа 1 м, совпадает с высотой из шапки текста); длина окружности = сторона листа 2000 мм, отсюда расчётный диаметр = 2000/π ≈ 636.6 мм — практически совпадает с заявленными в шапке текста 640 мм (расхождение ~0.5%, в пределах допуска). Конфликта нет."

constraints: {budget: 3000}
