# 57. Держатель рулонов (плёнка, скотч, бумага) на шпильке.
# Стена — плоскость y=0 (вне модели). Основание (base) лежит горизонтально у стены вдоль X.
# Щёчки (cheek) стоят по концам основания, выступая от стены вперёд (по Y) на 250 мм.
# Вариант геометрии (a): щёчки стоят СНАРУЖИ основания по X (основание 600 мм целиком между
# внутренними гранями щёчек), итоговая ширина сборки по X = 600 + 2*20 = 640 мм.
# Это расходится с шапкой текста «600×145 мм» — расхождение оставлено как spec.conflict_overall
# (см. claims/ambiguities), а не подогнано молча.
project:
  id: 57_derzhatel_rulonov_plenka_skotch_bumaga_n
  name: "Держатель рулонов (плёнка, скотч, бумага) на шпильке"
  category: wood+metal
  units: mm
  tool_profile: cordless_12v_36nm
  source_text: >
    Стенной держатель для мастерской: рулоны вращаются на резьбовой шпильке между двумя деревянными
    щёчками. Отпилить 2 щёчки 250 мм и основание 600 мм из доски. В щёчках просверлить отверстия 8 мм
    на одной высоте. Собрать П-образную раму на саморезы 51 мм. Продеть шпильку М8, зажать гайками
    с шайбами. Повесить на дюбели.

stock:
  - {id: board145, name: "Доска 20х145", material: pine, type: board, section: 20x145, length: 2000, kerf: 1.5, sku: "102355"}
  - {id: rod8, name: "Шпилька резьбовая М8", material: galvanized, type: threaded_rod, diameter: 8, length: 1000, sku: "665878"}

parts:
  - id: base
    name: "Основание (у стены)"
    stock: board145
    length: 600
    orient: XZY
    at: [20, 0, 0]
  - id: cheek
    name: "Щёчка"
    stock: board145
    qty: 2
    length: 250
    instances:
      - {at: [0, 0, 0], orient: YZX}
      - {at: [620, 0, 0], orient: YZX}
    features:
      - {type: hole, diameter: 8, position: {along_length: 220, along_width: center}}
  - id: rod
    name: "Шпилька М8 между щёчками"
    stock: rod8
    length: 640
    orient: XYZ
    at: [0, 216, 68.5]

joints:
  - {id: base_left,  type: screw, part_a: "cheek#1", part_b: base, fastener: {type: wood_screw, diameter: 3.5, length: 51}}
  - {id: base_right, type: screw, part_a: "cheek#2", part_b: base, fastener: {type: wood_screw, diameter: 3.5, length: 51}}
  - {id: rod_left,   type: inserted, part_a: rod, part_b: "cheek#1"}
  - {id: rod_right,  type: inserted, part_a: rod, part_b: "cheek#2"}

hardware:
  - {id: rod_nuts,    type: other, qty: 2, mounts: [cheek], name: "Гайка М8 DIN 934", sku: "101746"}
  - {id: rod_washers, type: other, qty: 2, mounts: [cheek], name: "Шайба 8х16 DIN 125А", sku: "109300"}
  - {id: wall_dowels,  type: wall_dowel, qty: 2, mounts: [base], screws_per_unit: 0, name: "Дюбель 6x30 с шурупом", sku: "687547"}

steps:
  - {title: "Отпилить щёчки и основание, просверлить 8 мм в щёчках", add: [base, cheek], joints: []}
  - {title: "Собрать П-образную раму на саморезы 51 мм", add: [], joints: [base_left, base_right]}
  - {title: "Продеть шпильку М8, зажать гайками с шайбами", add: [rod], joints: [rod_left, rod_right]}
  - {title: "Повесить на дюбели", add: [], joints: []}

claims:
  - {kind: overall, value: [600, 145, 250], source: "шапка текста «600×145 мм» + глубина щёчки 250 мм из шага 1", tolerance: 5}

ambiguities:
  - "Шапка текста даёт габарит «600×145 мм» (видимо, основание + высота доски). По факту сборки: основание физически 600 мм (как явно велит шаг 1 «отпилить... основание 600 мм»), щёчки стоят СНАРУЖИ основания по его концам (толщина щёчки 20 мм каждая) — иначе детали пересекались бы объёмами. Итоговая ширина сборки по X = 640 мм, глубина (щёчки) = 250 мм. Это разошлось с шапкой (600×145) — оставлено как заявленный конфликт (claims/spec.conflict_overall), а не подогнано молча под альтернативный вариант (основание 560 мм между щёчками)."
  - "Высота отверстия 8 мм в щёчках (на какой высоте от стены/пола) в тексте не названа числом — принято along_length=220 мм от стены (30 мм от переднего края щёчки), одинаково в обеих щёчках, чтобы рулоны висели с запасом от стены и не касались основания."
  - "Число дюбелей для основания в тексте не названо — принято 2 (по концам основания)."
  - "Число гаек и шайб на шпильку в тексте не названо («гайками с шайбами», мн. число) — принято по 1 гайке + 1 шайбе с каждого выступающего конца шпильки (2 гайки + 2 шайбы), хотя упаковки куплены с запасом (10 гаек, 20 шайб)."
  - "Шпилька физически 1000 мм (покупная длина), в сборке смоделирована длиной 640 мм (от внешней грани левой щёчки до внешней грани правой, вплотную под гайки) — остаток шпильки отрезается; глубина завинчивания/резьбы под гайки отдельно не моделируется."

constraints: {budget: 3000}
